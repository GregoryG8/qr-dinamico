<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generador de QR</title>
</head>
<body>
  <main>
    <h1>Generador de QR</h1>

    <section class="editor" aria-labelledby="form-title">
      <form id="form">
        <h2 id="form-title">Nuevo QR</h2>

        <div class="field">
          <label for="name">Nombre o etiqueta</label>
          <input id="name" name="name" required autocomplete="off" placeholder="Ej: Cartel tienda centro">
        </div>

        <div class="field">
          <label for="url">URL dentro del QR</label>
          <p id="url-hint" class="hint">La ruta de tu dominio que redirige. Debe empezar por https://</p>
          <input id="url" name="url" type="url" required pattern="https://.+" autocomplete="off"
                 placeholder="https://midominio.com/q/abc123" aria-describedby="url-hint">
          <p id="url-error" class="error">Escribe la URL completa, empezando por https://</p>
        </div>

        <div class="field">
          <label for="logo-file">Logo al centro (PNG o SVG, opcional)</label>
          <input id="logo-file" type="file" accept="image/png,image/svg+xml">
          <p class="hint"><span id="logo-status"></span> <button type="button" id="remove-logo" class="link">Quitar logo</button></p>
        </div>

        <div class="row">
          <div class="field">
            <label for="fg">Color del QR</label>
            <input id="fg" name="fg" type="color" value="#111111">
          </div>
          <div class="field">
            <label for="bg">Color del fondo</label>
            <input id="bg" name="bg" type="color" value="#ffffff">
          </div>
        </div>

        <div class="row">
          <div class="field">
            <label for="dots">Estilo de los puntos</label>
            <select id="dots" name="dots">
              <option value="square">Cuadrado</option>
              <option value="rounded" selected>Redondeado</option>
              <option value="dots">Puntos</option>
              <option value="extra-rounded">Extra redondeado</option>
            </select>
          </div>
          <div class="field">
            <label for="corners">Esquinas (ojos)</label>
            <select id="corners" name="corners">
              <option value="square">Cuadradas</option>
              <option value="rounded" selected>Redondeadas</option>
              <option value="dot">Punto</option>
            </select>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="primary">Guardar</button>
          <button type="button" id="new">Nuevo</button>
        </div>
        <p id="status" role="status"></p>
      </form>

      <aside class="preview" aria-label="Vista previa">
        <div class="canvas">
          <img id="preview" alt="Vista previa del QR" hidden>
          <p id="preview-empty">Escribe una URL https:// para ver la vista previa.</p>
        </div>
        <p id="warning" class="warning" role="status"></p>
        <div class="actions">
          <button type="button" id="dl-svg">Descargar SVG</button>
          <button type="button" id="dl-png">Descargar PNG</button>
        </div>
        <p class="hint">SVG para imprenta. PNG de al menos 2000 px.</p>
      </aside>
    </section>

    <section aria-labelledby="list-title">
      <h2 id="list-title">QR guardados</h2>
      <p id="empty" class="hint">Aún no hay QR guardados.</p>
      <ul id="list"></ul>
    </section>
  </main>

  <template id="item">
    <li>
      <img class="thumb" alt="" width="64" height="64">
      <div class="info"><strong class="name"></strong><span class="url"></span></div>
      <div class="actions">
        <button type="button" data-act="edit">Editar</button>
        <button type="button" data-act="dup">Duplicar</button>
        <button type="button" data-act="svg">SVG</button>
        <button type="button" data-act="png">PNG</button>
        <button type="button" data-act="del" class="danger">Borrar</button>
      </div>
    </li>
  </template>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
